# workers/wrangler.redirect.toml — redirect 301 verso costeve.com.
#
# Deploy:
#   cd workers && wrangler deploy -c wrangler.redirect.toml
#
# Copre il vecchio dominio (apex e www) e www.costeve.com, che redirige
# all'apex. Il Worker R2 usa wrangler.toml e le route del nuovo dominio.

name = "stefanocosta-redirect"
main = "redirect.js"
compatibility_date = "2025-06-01"

routes = [
  { pattern = "stefanocosta.me/*", zone_name = "stefanocosta.me" },
  { pattern = "www.stefanocosta.me/*", zone_name = "stefanocosta.me" },
  { pattern = "www.costeve.com/*", zone_name = "costeve.com" }
]
