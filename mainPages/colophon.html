<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Colophon — how this site is built, its design philosophy, and the tools behind it.">
    <title>Colophon | Stefano Costa</title>
    <!-- base.css is linked directly (not only injected by commonHeader.js) so the
         browser starts fetching it during HTML parsing, not after the JS runs. -->
    <!-- Headings inherit the browser's default bold, so Bold is on the critical path
         for the first paint just as much as Regular. Italic is not, so it is left to
         load on demand. All three are subset to the glyphs this site actually uses. -->
    <link rel="preload" href="../style/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../style/fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../style/base.css">
    <meta property="og:title" content="Colophon | Stefano Costa">
    <meta property="og:description" content="Colophon — how this site is built, its design philosophy, and the tools behind it.">
    <meta property="og:image" content="https://stefanocosta.me/img/preview_image.jpg">
    <meta property="og:url" content="https://stefanocosta.me/mainPages/colophon.html">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="../img/icon/favicon.svg">
    <script src="../javascript/commonHeader.js" defer></script>
    
</head>
<body>
    <main>

    <h1 class="title">Colophon</h1>

    <h2>Colors</h2>
    <table class="center">
        <tbody>
            <tr>
                <td>link</td>
                <td class="color-swatch-link">#7FCEF0</td>
            </tr>
            <tr>
                <td>italic</td>
                <td class="color-swatch-italic">#FBFFAD</td>
            </tr>
            <tr>
                <td>background</td>
                <td class="color-swatch-bg">#3E3E3E</td>
            </tr>
            <tr>
                <td>text</td>
                <td class="color-swatch-text">#D7D7D7</td>
            </tr>
            <tr>
                <td>bold</td>
                <td class="color-swatch-bold">#FFA500</td>
            </tr>
        </tbody>
    </table>

    <h2>Typography</h2>
    <p class="center"><a target="_blank" href="https://www.jetbrains.com/lp/mono/">JetBrains Mono</a></p>   

    <h2>Stack</h2>
