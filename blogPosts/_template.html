<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="POST DESCRIPTION (max 160 characters).">
    <title>POST TITLE | Source of Truth</title>
    <!-- base.css is linked directly (not only injected by commonHeader.js) so the
         browser starts fetching it during HTML parsing, not after the JS runs. -->
    <!-- Headings inherit the browser's default bold, so Bold is on the critical path
         for the first paint just as much as Regular. Italic is not, so it is left to
         load on demand. All three are subset to the glyphs this site actually uses. -->
    <link rel="preload" href="../style/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../style/fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../style/base.css">
    <meta property="og:title" content="POST TITLE | Stefano Costa">
    <meta property="og:description" content="POST DESCRIPTION (max 160 characters).">
    <meta property="og:image" content="https://stefanocosta.me/img/preview_image.jpg">
    <meta property="og:url" content="https://stefanocosta.me/blogPosts/FILE%20NAME.html">
    <meta property="og:type" content="article">
    <link rel="icon" type="image/svg+xml" href="../img/icon/favicon.svg">
    <script src="../javascript/commonHeader.js" defer></script>
    <!-- datePublished is what gen_feed.py keys on: without it the post stays out
         of the RSS feed. Fill it in when the post actually goes live. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "POST TITLE",
      "datePublished": "YYYY-MM-DD",
      "author": {"@type": "Person", "name": "Stefano Costa", "url": "https://stefanocosta.me/"},
      "url": "https://stefanocosta.me/blogPosts/FILE%20NAME.html",
      "description": "POST DESCRIPTION (max 160 characters)."
    }
    </script>
    <script src="../javascript/toc.js"></script>

    <link rel="stylesheet" href="../style/blog.css">
            <!-- Add gallery.css + gallery.js only if the post contains image galleries -->
    <!-- <link rel="stylesheet" href="../style/gallery.css"> -->
    <!-- <script src="../javascript/gallery.js"></script> -->
</head>

<body>
    <main>

    <div class="bottom_space_big">
        <h1>POST TITLE</h1>
        <h2 class="subtitle">Subtitle (optional)</h2>
        <h3 class="subtitle"><a
                href="https://forum.effectivealtruism.org/posts/bbtvDJtb6YwwWtJm7/epistemic-status-an-explainer-and-some-thoughts"
                target="_blank">Epistemic status</a>: <i>...</i></h3>

        <div class="center">
            <div><em>DD Month YYYY</em></div>
            <div><em>XXX words</em> - <em>X min read</em></div>
            <div><em><a href="../mainPages/Blog_pages.html">Other posts</a></em></div>
        </div>

        <section class="toc">
            <div class="box-title">
                <h4>TOC</h4>
            </div>
            <!-- toc.js populates this automatically from h2/h3 elements -->
        </section>

        <section class="tldr">
            <div class="box-title">
                <h3>TL;DR</h3>
            </div>
            <p>One-paragraph summary of the post.</p>
        </section>


        <h2 id="section-1">
            <a href="#section-1">■ Section 1</a>
        </h2>

        <!-- Italics: <i> renders YELLOW (i, .yellow { color: #FBFFAD }) — use it for real
             emphasis (coined term, thesis). For "tone" italics — quoted speech inside "…",
             book/work titles, scare-quotes — use <em> (plain italic, no colour). Rule of
             thumb: already inside quotes → <em>. See CLAUDE.md §"Corsivi". -->
        <p class="justify">
            Body text here.
        </p>

        <h3 id="subsection-1-1">
            <a href="#subsection-1-1">└─ Subsection 1.1</a>
        </h3>

        <p class="justify">
            Body text here.
        </p>

        <hr>

        <h2 id="section-2">
            <a href="#section-2">■ Section 2</a>
        </h2>

        <p class="justify">
            Body text here.
        </p>

    </div>

    <!-- Optional: callout / quote block -->
    <!--
    <section class="callout">
        <div class="box-title"><img width="32" height="32" loading="lazy" class="icon_inline" src="../img/icon/quotes.webp" alt="">
            <h4>Quote title</h4>
        </div>
        <p class="justify">Quote text.</p>
        <p class="source">Source, p. XX</p>
    </section>
    -->

    <!-- Optional: warning callout -->
    <!--
    <section class="callout">
        <div class="box-title"><img width="32" height="32" loading="lazy" class="icon_inline" src="../img/icon/warning.webp" alt="">
            <h4>Warning</h4>
        </div>
        <p class="justify">Warning text.</p>
    </section>
    -->
    </main>

    <script src="../javascript/footer.js"></script>
</body>

</html>
